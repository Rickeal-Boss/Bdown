<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Bdown · 下载中心</title>
  <link rel="stylesheet" href="../ui/common.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">B</span>
      <div>
        <div class="brand-name">Bdown 下载中心</div>
        <div class="brand-sub" id="accountLine">正在读取账号状态…</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="bd-badge" id="storageBadge" title="OPFS 临时空间占用">临时空间 —</span>
      <select id="saveMode" class="bd-select" style="width:auto" title="保存方式">
        <option value="ask">每次询问保存位置</option>
        <option value="downloads">浏览器默认下载目录</option>
      </select>
      <button id="btnOptions" class="bd-btn bd-btn--sm">设置</button>
      <button id="btnClean" class="bd-btn bd-btn--sm bd-btn--danger">清理临时文件</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <span class="bd-label">任务</span>
      <span id="counts" class="bd-hint"></span>
    </div>
    <div class="toolbar-right">
      <label class="bd-switch" title="批量任务共用一个文件夹">
        <input type="checkbox" id="rememberDir" /><span>批量保存到同一文件夹</span>
      </label>
      <button id="btnStartAll" class="bd-btn bd-btn--primary bd-btn--sm">全部开始</button>
      <button id="btnPauseAll" class="bd-btn bd-btn--sm" title="暂停所有正在下载的任务（保留断点，可稍后继续）">全部暂停</button>
      <button id="btnCancelAll" class="bd-btn bd-btn--sm">全部取消</button>
      <button id="btnClearDone" class="bd-btn bd-btn--sm">清除已完成</button>
    </div>
  </div>

  <main class="bd-scroll">
    <div id="empty" class="bd-empty">
      暂无任务。<br />
      在 B 站视频页点击右下角「下载」悬浮按钮，或在扩展弹窗里选择清晰度后点击「开始下载」。
    </div>
    <div id="taskList" class="task-list"></div>
  </main>

  <template id="taskTemplate">
    <article class="task">
      <div class="task-head">
        <div class="task-title bd-grow">
          <span class="t-name bd-ellipsis"></span>
          <span class="t-sub bd-hint bd-ellipsis"></span>
        </div>
        <span class="t-status bd-badge"></span>
      </div>
      <div class="task-progress">
        <div class="bd-progress"><i style="width:0%"></i></div>
        <div class="task-progress-meta">
          <span class="t-phase bd-hint"></span>
          <span class="t-bytes bd-hint"></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="bd-btn bd-btn--sm act-start">开始</button>
        <button class="bd-btn bd-btn--sm act-pause">暂停</button>
        <button class="bd-btn bd-btn--sm act-resume">继续</button>
        <button class="bd-btn bd-btn--sm act-cancel">取消</button>
        <button class="bd-btn bd-btn--sm act-retry">重试</button>
        <button class="bd-btn bd-btn--sm act-open">打开文件</button>
        <button class="bd-btn bd-btn--sm act-remove bd-btn--danger">移除</button>
      </div>
      <div class="task-outputs bd-hint"></div>
    </article>
  </template>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
