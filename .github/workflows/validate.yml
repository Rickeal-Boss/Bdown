name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 静态校验（JS 语法 / JSON / manifest 引用 / DNR 规则 / 导入图）
        run: node tools/validate.mjs

      - name: 核心模块自检（XSS / urlencode / md5 / av-bv / WBI mixin key / 文件名安全）
        run: node tools/selftest-core.mjs

      # 安全不变量：接口返回的 URL 必须过域名白名单才能带凭证、HTML 转义覆盖 5 字符、
      # 文件名挡路径穿越、源码无 eval 类危险模式、manifest 不多余索取权限。
      - name: 安全不变量自检（URL 白名单 / 转义 / 穿越 / 权限）
        run: node tools/test-security.mjs

      - name: api.get 本地预校验自检（防止无 bvid/avid/ep_id 请求触发 -400）
        run: node tools/test-api-validation.mjs

      # 取消必须贯穿整条请求（含读 body 阶段）；不该重试的错误不得重试；
      # 服务器忽略 Range 时不能重复全量下载；retry 的 times=NaN 不能静默 no-op
      - name: 下载器不变量自检（取消传播 / 重试语义 / rangeIgnored）
        run: node tools/test-downloader.mjs

      # 「下载后半段变慢」的两个结构性根因：
      #   1. 响应体读取无超时 —— 服务端滴灌时单片永久挂住（doFetch 的超时只到响应头）
      #   2. 8 路并发全打 list[0]，backupUrls 从不参与负载均衡
      # 另锁 sink 写入链不得被单次失败毒化。
      - name: 停滞检测与地址轮换自检（body 读超时 / 多地址分摊 / 写入链不毒化）
        run: node tools/test-stall-rotation.mjs

      - name: 断点续传逻辑自检（区间合并 / 缺失计算 / 续传集成）
        run: node tools/test-resume.mjs

      - name: 断点续传持久化纯逻辑自检（key 派生 / 清单校验）
        run: node tools/test-resume-store.mjs

      # 「暂停后继续却从头下载」的链路复现：用内存版 OPFS 跑真实的
      # 写入→扩展文件长度→写清单→重开 全过程。
      # 纯逻辑测试（planResume）全绿也照样漏掉过这个 bug —— 因为判据写错时
      # 纯函数测试看不出来，必须把 OPFS 的"随机偏移写入会扩展长度"这一语义跑出来。
      - name: 暂停/继续 链路自检（内存版 OPFS，防续传静默失效）
        run: node tools/test-resume-restart.mjs

      # 暂停/继续这一版新增的三条静默失效路径：
      #   1. 清单判 complete 只信清单不看 .part 实际长度 → 混流出静默损坏的文件
      #   2. Task.toRecord 不带 resumeKeys → 暂停后重开页面，.part 永久泄漏
      #   3. 没有上一轮保存位置时默默改存下载目录 → 用户选的文件夹被无视
      - name: 暂停/继续守护自检（complete 需以 .part 实际长度为准 / 续传 key 随任务持久化）
        run: node tools/test-resume-pause-guard.mjs

      - name: playurl 路由自检（ugc / 番剧 / 课程三分支）
        run: node tools/test-playurl-routing.mjs

      # 课程链接 /cheese/play/ep<id> 若被通用 /ep(\d+) 抢先匹配，会被当成番剧
      # 打到 /pgc 端点（错误），任务必失败。extractVideoId 是每次下载的入口，
      # 历史上零测试覆盖 —— 这条锁住它。
      - name: 视频 ID 解析自检（BV/av/ep/ss/cheese + 边界与脏链接）
        run: node tools/test-extract-id.mjs

      - name: 清晰度挑选自检（DASH 下 qn 无效，必须客户端挑）
        run: node tools/test-quality-pick.mjs

      - name: 章节模块自检（view_points 解析与 txt/vtt 导出）
        run: node tools/test-chapters.mjs

      # 合集（ugc_season）批量：把合集每一集展开成独立任务。
      # ⚠️ 这个套件从 v1.4.14 加上后**一直没被工作流引用**，等于从未在 CI 跑过 ——
      # 由 lint-ci-coverage.mjs 在 v1.4.21 发现。现在补上。
      - name: 合集解析自检（ugc_season 展开 / 可批量化判定）
        run: node tools/test-season.mjs

      # 弹幕文本完全不可控（颜文字、代码片段、{\an8} 之类），而 ASS 里 { } \ 是控制字符。
      # 转义漏掉会产出结构损坏的 ASS。这个模块此前**零测试覆盖**（v1.4.22 补上）。
      - name: 弹幕模块自检（ASS 控制字符转义 / SRT 结构 / 过滤 / 边界）
        run: node tools/test-danmaku.mjs

      # 字幕文本（多为 AI 生成）同样不可控：ASS 里 { } \ 是控制字符、
      # 物理换行会切断事件行；SRT 里连续换行会切断块。此模块此前零测试覆盖。
      - name: 字幕模块自检（ASS 转义 / SRT 块结构 / 语言挑选）
        run: node tools/test-subtitle.mjs

      - name: NFO 元数据自检（XML 转义 / movie+episode+tvshow 三形态）
        run: node tools/test-nfo.mjs

      # 防止 v1.0.0 至今没人能跑通 merge 模式这种病再回来：构造真实
      # DASH 分片字节（无 moov），断言 scanFile 抛我们改过的明确错误。
      - name: mp4.js 自检（真实分片流必须给出明确错误，不静默 pass）
        run: node tools/test-mp4.mjs

      # 大 moof（>16KB）会被 16KB 扫描窗口静默丢弃 -> 产出"能播但缺半段"的合法文件。
      # 这是本项目最危险的失败形态（真机极难发现），必须锁住。
      - name: 片段扫描回归（大 moof 不被丢弃 / 截断文件必报错）
        run: node tools/test-mp4-fragments.mjs

      # durl 可能是多段；只下第一段会产出截断文件且进度永远到不了 100%
      - name: durl 多段下载回归（全部分段拼接，不互相覆盖）
        run: node tools/test-durl-multipart.mjs

      # 防「已登录用户被误判成未登录」导致清晰度降级（1080P -> 720P）
      - name: nav 健壮性自检（超时/重试/响应校验 + 抖动时不降级登录态）
        run: node tools/test-nav.mjs

      # DNR 规则改请求头极易产生副作用：曾经用一条宽泛规则命中所有
      # *.bilibili.com 子域（含 passport 登录接口）并删 Origin，
      # 导致扩展开启时主站多个页面无法登录。这条锁住"不误伤主页面"的边界。
      - name: DNR 规则副作用防御（不误伤主站 / 通用 CDN / 必须补 Referer）
        run: node tools/test-dnr-side-effects.mjs

      # B 站 CDN 地址约 120 分钟失效（403/404）：必须重新 playurl 换地址，
      # 拿同一个过期地址重试必然全败
      - name: 播放地址过期刷新自检（403/404 -> refreshUrls 重试）
        run: node tools/test-url-refresh.mjs

      # 大文件（>256MB 走 OPFS）合并前必须 flush 输入 sink，否则读到空文件
      # 表现为「未找到 moov 盒子」。这是 v1.0.0 起就存在、真机必崩的根 bug。
      - name: 合并 flush 自检（读回输入 sink 前必须 close）
        run: node tools/test-merge-flush.mjs

      # —— 以下两条是「默认 merge 模式 100% 失败」那次 P0 的回归防护 ——
      # 那次的根因：engine.js 重构（vStage→vPrep）漏改两行，`node --check`
      # 语法完全合法、导入图检查也通过，但 ESM 严格模式下运行时 ReferenceError。
      # 所以语法级检查之外还要补两条：静态查未定义标识符 + 真跑一遍四条分支。

      - name: 未定义标识符检查（node --check 抓不到读取未声明变量）
        run: node tools/lint-noundef.mjs

      # 用 heredoc 写源码时，文本里的 \u0000 这类转义会被工具链解释成**真实控制字符**
      # 写进文件。曾把 util.js 写坏（含真实 NUL 字节 → grep 判定为 Binary file，
      # 破坏 diff / 代码审查）。这条扫描全部源码禁止非法控制字符。
      - name: 控制字符检查（禁止 tab/LF/CR 之外的 C0 控制字符）
        run: node tools/lint-control-chars.mjs

      # 文案类改动同样需要可执行断言，否则下次重构能悄悄改回去。
      # 锁两件容易脱节的事：① 仅音频产物扩展名（普通 .m4a / 无损 .flac）
      # ② 弹窗的下载方式自 v1.4.25 起「本次生效、不写回全局设置」。
      # 附带守护：README 不得声称「已真机验证」（.flac 至今未真机验证）。
      - name: 文档一致性检查（README / 设置页文案 vs 代码实际行为）
        run: node tools/lint-docs-consistency.mjs

      # 弹窗 DOM id 一致性：popup.js $('xxx') 引用的每个 id 必须存在于 popup.html。
      # 历史 P0（v1.4.27 审查）：合集区块的 4 个 id 只在 JS 里、HTML 从没写过，
      # 合集视频打开弹窗直接 TypeError —— 纯逻辑测试全绿也发现不了这类断链。
      - name: 弹窗 id 一致性检查（JS 引用 vs HTML 定义，防「引用不存在的 DOM」）
        run: node tools/lint-popup-ids.mjs

      # 元检查：本工作流是**逐条列文件**的，新增测试若忘了加进来，
      # CI 会"绿着"却 0 覆盖。这条断言所有 tools/test-*.mjs 与
      # tools/lint-*.mjs 都已被本工作流引用。
      - name: CI 覆盖检查（新增测试必须被工作流引用，防止"绿着没跑"）
        run: node tools/lint-ci-coverage.mjs

      - name: 引擎端到端（合成 fMP4，四条分支都断言 done + 校验合并产物结构）
        run: node tools/test-engine-e2e.mjs

      - name: 用合成 m4s 跑一遍混流器自检
        run: node tools/selftest-synthetic.mjs

      # 原来这里写成 `if [ -d samples ] ... else echo 跳过; fi`，
      # 而仓库从来没有 samples/ —— 这条**永远走 else**，一直是"跳过的绿"，
      # 看着像有真实素材校验其实 0 覆盖。现在改成现场合成样本再真跑。
      - name: 混流产物结构校验（合成样本 -> mux-test，含 SHA-256 逐字节比对）
        run: |
          node tools/fixtures/make-samples.mjs samples
          node tools/mux-test.mjs samples/video.m4s samples/audio.m4s merged.mp4

      - name: 独立解析器交叉校验（有产物 mp4 时执行）
        run: |
          # tools/mp4check.py 是纯 Python 实现的 ISO-BMFF 解析器，
          # 完全不引用项目代码，用来独立复核混流产物的结构。
          if ls ./*.mp4 >/dev/null 2>&1; then
            python3 tools/mp4check.py "$(ls ./*.mp4 | head -1)"
          else
            echo "无混流产物，跳过"
          fi

      - name: 打包扩展（分发 / 商店提交用）
        run: node tools/package.mjs --check

      # ★ 站在产物侧独立复核，不信任上游的排除规则。
      # 本项目在"包内文件数/内容漂移"上栽过三次，每次形态都不同：
      #   ① 临时解压目录 _zv 残留 → 44 → 88 文件（体积翻倍）
      #   ② 临时探针脚本 .sec-*.mjs 残留 → 44 → 46（点开头，ls 看不见）
      #   ③ 0 字节的 node_diff.txt 一直跟着打包（已清理）
      # 前两条由 package.mjs 从源头排除，但排除规则本身也可能被改坏 —— 这道门兜底。
      # 基线变红是**提醒**不是失败：确认是预期变化就更新 test-release-gate.mjs 里的 BASELINE。
      - name: 发布门禁（产物文件数 / 隐藏文件 / 必备结构）
        run: node tools/test-release-gate.mjs

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: Bdown-extension-v${{ github.run_number }}
          path: dist/*.zip
